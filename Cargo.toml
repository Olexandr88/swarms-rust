[workspace]
resolver = "2"
members = [
    "swarms",
    "swarm_agent",
    "swarm_tool",
    "swarm_wallet",
    "swarm_llm",
    "swarm_memory",
    "demo_btc_prediction_consensus_swarm",
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11.6"
thiserror = "2.0.11"
reqwest = { version = "0.12.12", features = ["json", "blocking"] }
dotenv = "0.15"
rand = "0.8"
tempfile = "3.2"
futures = "0.3"
tokio-stream = "0.1"
parking_lot = "0.12"
dashmap = "6.1.0"
tracing = "0.1"
derive_more = "1.0.0"
cargo-platform = "0.1.2"
alloy = { version = "0.9.2", features = ["full"] }
alloy-contract = "0.9.2"
solana-sdk = "2.1.8"
bs58 = "0.5.1"
bytes = "1.0.1"
rusqlite = "0.32.1"
chrono = "0.4.19"
yahoo_finance_api = "2.4.0"


[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mind Network"]
description = "A Rust implementation of the swarms multi-agent collaboration framework"
license = "MIT"
